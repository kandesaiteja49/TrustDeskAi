version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trustdesk-postgres
    restart: always
    environment:
      POSTGRES_DB: trustdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: saiteja
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: