spring.application.name=trustdeskAi
server.port=8083
spring.mvc.servlet.path=/api/v1
# ===================================================================
# POSTGRESQL & JPA CONFIGURATION
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5434/trustdesk
spring.datasource.username=postgres
spring.datasource.password=saiteja
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# SPRING AI - GOOGLE GENAI (GEMINI)
# ===================================================================
# Set your environment variable GEMINI_API_KEY or replace ${GEMINI_API_KEY} directly
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.2


# ===================================================================
# SPRING AI - GOOGLE GENAI EMBEDDINGS
# ===================================================================

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

spring.ai.google.genai.embedding.text.model=text-embedding-004

spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT


## ===================================================================
## SPRING AI - BAAI LOCAL EMBEDDING MODEL (ONNX TRANSFORMERS)
## ===================================================================
## Correct property keys (no .onnx in the tokenizer key):
#spring.ai.embedding.transformer.onnx.model-uri=classpath:models/bge-small-en-v1.5.onnx
#spring.ai.embedding.transformer.tokenizer.uri=classpath:models/tokenizer.json
## Disable online cache lookup fallback:
#spring.ai.embedding.transformer.cache.enabled=false

# ===================================================================
# SPRING AI - PGVECTOR STORE
# ===================================================================
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# Note: 384 dimensions matches bge-small-en-v1.5. Set to 1024 if using bge-large or bge-m3.
spring.ai.vectorstore.pgvector.dimensions=768

# ===================================================================
# FILE UPLOAD LIMITS (SPRING MULTIPART)
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# Enable detailed Spring AI logs (Chat Client, Functions, Vectors)
logging.file.name=logs/trustdesk-ai.log
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.chat.client=DEBUG
logging.level.org.springframework.ai.model.function=DEBUG

# Optional: Log raw web requests if needed
logging.level.org.springframework.web=INFO