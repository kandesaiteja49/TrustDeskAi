spring.application.name=trustdeskAi
server.port=8083
spring.mvc.servlet.path=/api/v1
# ===================================================================
# POSTGRESQL & JPA CONFIGURATION
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5434/trustdesk
spring.datasource.username=postgres
spring.datasource.password=saiteja
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# SPRING AI - EMBEDDING CONFIGURATION
# ===================================================================
# Using a stub model in JacksonConfig to avoid ONNX download issues
spring.ai.embedding.model=stub

# ===================================================================
# SPRING AI - GROQ CONFIGURATION
# ===================================================================
# Set your environment variable GROQ_API_KEY
spring.ai.groq.api-key=${GROQ_API_KEY}
spring.ai.groq.chat.options.model=llama-3.3-70b-versatile
spring.ai.groq.chat.options.temperature=0.2

# ===================================================================
# SPRING AI - PGVECTOR STORE
# ===================================================================
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# 384 dimensions matches bge-small-en-v1.5
spring.ai.vectorstore.pgvector.dimensions=384

# ===================================================================
# FILE UPLOAD LIMITS (SPRING MULTIPART)
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# Enable detailed Spring AI logs
logging.file.name=logs/trustdesk-ai.log
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.chat.client=DEBUG
logging.level.org.springframework.ai.model.function=DEBUG

# Optional: Log raw web requests if needed
logging.level.org.springframework.web=INFO
